name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build macOS arm64 (Apple Silicon)
        run: bun build --compile --target=bun-darwin-arm64 console/index.ts --outfile todo-darwin-arm64

      - name: Build macOS x64 (Intel)
        run: bun build --compile --target=bun-darwin-x64 console/index.ts --outfile todo-darwin-x64

      - name: Compute SHA256
        run: |
          shasum -a 256 todo-darwin-arm64 | awk '{print $1}' > todo-darwin-arm64.sha256
          shasum -a 256 todo-darwin-x64  | awk '{print $1}' > todo-darwin-x64.sha256
          echo "arm64 sha256: $(cat todo-darwin-arm64.sha256)"
          echo "x64   sha256: $(cat todo-darwin-x64.sha256)"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            todo-darwin-arm64
            todo-darwin-arm64.sha256
            todo-darwin-x64
            todo-darwin-x64.sha256
          generate_release_notes: true
